# 用途 / Task: flux · mid-timestep
# 命令 / Command: uv run unituner mid-timestep docs/examples/mid-timestep.toml --device cuda
# 先改模型、数据及输出路径；注释掉的参数为可选项，默认值通常无需填写。
# Replace model, data and output paths first. Commented options can normally be omitted.
# 参数教程 / Parameter guide: docs/training/parameters.md · docs/en/training/parameters.md

# unituner mid-timestep docs/examples/mid-timestep.toml --device cuda
# 随机种子；固定后便于比较配方，续训由状态文件恢复 RNG。
# Random seed for recipe comparisons; resume restores RNG from its state file.
seed = 42
# 最多编码的裁剪／分块对数。
# Maximum encoded crop/tile pairs.
calibration_pairs = 32
# random: 每图随机裁剪；tiles: 按 resolution 分块。
# random: one crop per image; tiles: full tiles at resolution.
calibration_sampling = "random"
# 训练 VAE 后验 mean/sample；省略遵循各家族策略，推理/预览使用均值。
# Training VAE posterior mean/sample; omission uses the family's policy, inference/previews use means.
posterior = "sample"

[model]
family = "flux"
vae = "/models/flux-vae.safetensors"

[dataset.defaults]
# 固定裁剪／分块尺寸 [宽, 高]，不缩放原图。
# Fixed crop/tile [width, height], without resizing the source.
resolution = [1024, 1024]

[dataset.groups.main]
source = "/data/hq"
low_quality_source = "/data/lq"
# 仅有 HQ：删除 low_quality_source，启用下列配方，可继续覆盖退化参数。
# HQ only: remove low_quality_source and enable the recipe; degradation fields can be overridden.
# [dataset.groups.main.degradation]
# enabled = true

[runtime]
# cuda_allow_tf32 = false
# cudnn_enabled = true
# cudnn_benchmark = true
# cudnn_deterministic = false
