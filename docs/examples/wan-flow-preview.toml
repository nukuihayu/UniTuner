# 用途 / Task: wan · train
# 命令 / Command: uv run unituner train docs/examples/wan-flow-preview.toml --device cuda
# 先改模型、数据及输出路径；注释掉的参数为可选项，默认值通常无需填写。
# Replace model, data and output paths first. Commented options can normally be omitted.
# 参数教程 / Parameter guide: docs/training/parameters.md · docs/en/training/parameters.md

[model]
family = "wan"
version = "2.1"
variant = "t2v"
weights = "artifacts/wan-2.1-t2v.safetensors"
vae = "artifacts/wan-vae.safetensors"
text_encoder = "artifacts/wan-umt5.safetensors"

[dataset.groups.main]
kind = "video"
source = "data/videos"
cache_directory = "cache/wan-t2v"
# [宽, 高] 像素；分桶开启时作为目标面积基准，实际尺寸随宽高比变化。
# [width, height] in pixels; with buckets enabled this sets target area, not one fixed crop size.
resolution = [512, 512]
batch_size = 1

repeats = 1
enable_bucket = true
bucket_no_upscale = false
caption_extension = ".txt"
# prompt = ""

[train]
max_updates = 1000
accumulation_steps = 2
learning_rate = 0.0001

weight_decay = 0.01
max_grad_norm = 1.0
lr_schedule = "constant"
warmup_updates = 0
include_layers = []
exclude_layers = []

[train.adapter]
algorithm = "lora"
rank = 16
alpha = 16.0

[execution]
precision = "fp32"
recompute = "block"

residency = "resident"
compile = false
# attention_activation_offload = false

[output]
directory = "runs/wan"
name = "model"
save_every_updates = 100

save_precision = "fp32"
# tensorboard = "runs/tensorboard"
# max_resume_checkpoints = 1
# max_weight_checkpoints = 0
# checkpoint_storage = "frozen-reference"
# log_every_seconds = 60.0

[preview]
every_updates = 100
at_start = true

[[preview.videos]]
prompt = "A small boat moving across a quiet lake"
negative_prompt = "blurry, distorted"
width = 512
height = 512
frames = 17
fps = 16
steps = 20
# Wan 采样求解器名称；使用该家族支持的取值。
# Wan sampling solver; choose a family-supported value.
solver = "unipc"
seed = 42

[method]
kind = "flow-matching"

[train.optimizer]
betas = [0.9, 0.999]
eps = 1e-08
backend = "auto"

[model.text.tokenizer]
offline = false
# source = "/models/tokenizer"
# revision = "commit-sha"

[runtime]
# cuda_allow_tf32 = false
# cudnn_enabled = true
# cudnn_benchmark = true
# cudnn_deterministic = false
