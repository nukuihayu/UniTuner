# 用途 / Task: qwen-image · generate
# 命令 / Command: uv run unituner generate docs/examples/qwen-image-layered-generate.toml --device cuda
# 先改模型、数据及输出路径；注释掉的参数为可选项，默认值通常无需填写。
# Replace model, data and output paths first. Commented options can normally be omitted.
# 参数教程 / Parameter guide: docs/training/parameters.md · docs/en/training/parameters.md

# 推理输出文件路径；图像通常为 PNG，视频按对应命令配置。
# Inference output file path; usually PNG for images, family-specific for video.
output = "output/qwen-layered.png"

[model]
family = "qwen-image"
variant = "layered"
weights = "artifacts/qwen-image-layered.safetensors"
vae = "artifacts/qwen-image-rgba-vae.safetensors"
text_encoder = "artifacts/qwen2.5-vl"

[sampling]
prompt = ""
# Qwen layered 的图层描述语言 en/zh。
# Layer-caption language en/zh for Qwen layered.
caption_language = "en"
reference_images = ["input/source.png"]
# 推理条件图缩放策略 preferred/original/output；output 仅支持对应 Qwen 模型。
# Inference reference resize policy preferred/original/output; output is supported only by applicable Qwen models.
conditioning_resize = "output"
# Qwen layered 输出前景层数量；仅此变体使用。
# Foreground layer count for Qwen layered only.
output_layers = 4
width = 1024
height = 1024
seed = 42
steps = 25
guidance = 4.0
attention_backend = "torch"
# shift = 1.0
# negative_prompt = ""

[runtime]
# cuda_allow_tf32 = false
# cudnn_enabled = true
# cudnn_benchmark = true
# cudnn_deterministic = false

[model.text.tokenizer]
# source = "/models/tokenizer"
# revision = "commit-sha"
offline = false
