# 用途 / Task: minimax-h3 · generate-video
# 命令 / Command: uv run unituner generate-video docs/examples/minimax-h3-generate.toml --device cuda
# 先改模型、数据及输出路径；注释掉的参数为可选项，默认值通常无需填写。
# Replace model, data and output paths first. Commented options can normally be omitted.
# 参数教程 / Parameter guide: docs/training/parameters.md · docs/en/training/parameters.md

# Explicit FP32 generation; PNG requires sampling.frames=1.
# 推理输出文件路径；图像通常为 PNG，视频按对应命令配置。
# Inference output file path; usually PNG for images, family-specific for video.
output = "/outputs/h3.mp4"

[model]
# 模型家族；先按实际权重选择，再填写对应 variant/version。
# Model family; match the checkpoint before selecting variant/version.
family = "minimax-h3"
# 权重变体，如 base/turbo、dev、original；不能仅改名称来切换底模。
# Checkpoint variant, such as base/turbo, dev or original; use matching weights.
variant = "t2va"
# 本地权重文件、分片索引或支持的模型目录；替换为实际路径。
# Local weight file, shard index or supported model directory; replace the example path.
weights = "/models/h3/transformer.safetensors"
# 匹配该家族的本地 VAE 权重；缓存、预览和推理需要。
# Matching local VAE weights, required for caching, previews and inference.
vae = "/models/h3/video.safetensors"
# 本地文本编码器文件或目录；分词器来源单独配置。
# Local text encoder file or directory; tokenizer assets are configured separately.
text_encoder = "/models/h3/text.safetensors"

[model.minimax_h3]
# H3 本地音频 VAE 权重。
# Local H3 audio VAE weights.
audio_vae = "/models/h3/audio.safetensors"
# H3 文本编码器结构配置文件，需与权重匹配。
# H3 text encoder configuration matching its weights.
text_config = "/models/h3/text-config"
# H3 本地 processor 目录；未填时可用该家族默认来源。
# Local H3 processor directory; otherwise the family default source can be used.
text_processor = "/models/h3/processor"
# H3 文本编码设备；仅在需要单独放置编码器时设置。
# H3 text encoding device; set when placing the encoder separately.
text_device = "cpu"

[inputs]
# 本次生成/修复的提示词；与训练任务保持一致。
# Prompt for this generation/restoration request; match the training task.
prompt = "A quiet street at sunset, with distant traffic and birdsong."

[sampling]
# 输出宽度，像素；一般 16 对齐，Qwen2.1/H3 使用 32 对齐。
# Output width in pixels; generally align to 16, or 32 for Qwen2.1/H3.
width = 768
# 输出高度，像素；与宽度一起决定采样显存需求。
# Output height in pixels; together with width determines sampling memory use.
height = 1344
# 生成帧数；遵守家族帧数约束并与 fps 一起决定时长。
# Generated frame count; obey family constraints, with fps determining duration.
frames = 124
# 生成帧率；H3 使用原生 24 FPS。
# Generation frame rate; H3 uses native 24 FPS.
fps = 24
# 采样迭代数；省略使用变体默认，Turbo 与非蒸馏模型不要套用同一数值。
# Sampling iterations; omission uses variant defaults, do not reuse one value across Turbo and nondistilled models.
steps = 30
# 随机种子；固定后便于比较配方，续训由状态文件恢复 RNG。
# Random seed for recipe comparisons; resume restores RNG from its state file.
seed = 42
# H3 视频时间表移位，默认 12.0；训练和采样使用匹配配方。
# H3 video schedule shift, default 12.0; match the training/sampling recipe.
video_shift = 12.0
# H3 音频时间表移位，默认 3.0。
# H3 audio schedule shift, default 3.0.
audio_shift = 3.0
# H3 视觉条件清洁度；默认 0.999。
# H3 visual-condition cleanliness; default 0.999.
visual_condition_clean = 0.999
# H3 音频条件清洁度；默认 1.0。
# H3 audio-condition cleanliness; default 1.0.
audio_condition_clean = 1.0

[runtime]
# 允许支持 GPU 上的 TF32 矩阵运算；可能改变数值轨迹。
# Allow TF32 matrix operations on supported GPUs; may change numerical trajectories.
# cuda_allow_tf32 = false
# 启用 cuDNN 卷积后端；通常保持 true。
# Enable cuDNN convolution kernels; normally keep true.
# cudnn_enabled = true
# 搜索卷积算法；固定尺寸可尝试 true，首次运行会有搜索开销。
# Benchmark convolution algorithms; try true for stable shapes, with startup search overhead.
# cudnn_benchmark = true
# 限制为确定性 cuDNN 算法；需要重复性时开启，可能降低速度。
# Restrict cuDNN to deterministic algorithms for reproducibility, potentially reducing speed.
# cudnn_deterministic = false

[model.text.tokenizer]
# 省略 source 使用模型默认来源；填写本地目录后可开启 offline。
# Omit source for the family default; use a local directory with offline mode if needed.
# source = "/models/tokenizer"
# revision = "commit-sha"
offline = false
