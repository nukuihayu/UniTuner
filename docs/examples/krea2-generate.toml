# 用途 / Task: krea2 · generate
# 命令 / Command: uv run unituner generate docs/examples/krea2-generate.toml --device cuda
# 先改模型、数据及输出路径；注释掉的参数为可选项，默认值通常无需填写。
# Replace model, data and output paths first. Commented options can normally be omitted.
# 参数教程 / Parameter guide: docs/training/parameters.md · docs/en/training/parameters.md

# 推理输出文件路径；图像通常为 PNG，视频按对应命令配置。
# Inference output file path; usually PNG for images, family-specific for video.
output = "outputs/krea2.png"

[model]
family = "krea2"
variant = "raw"
weights = "artifacts/krea2.safetensors"
vae = "artifacts/qwen-image-vae.safetensors"
text_encoder = "artifacts/qwen3-vl-4b"

[sampling]
prompt = "A small garden in morning light"
negative_prompt = "blurry"
width = 1024
height = 1024
steps = 28
guidance = 5.5
seed = 42
attention_backend = "torch"
# shift = 1.0

[runtime]
# cuda_allow_tf32 = false
# cudnn_enabled = true
# cudnn_benchmark = true
# cudnn_deterministic = false

[model.text.tokenizer]
# source = "/models/tokenizer"
# revision = "commit-sha"
offline = false
