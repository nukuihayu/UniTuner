# 用途 / Task: z-image · train
# 命令 / Command: uv run unituner train docs/examples/restoration-full.toml --device cuda
# 先改模型、数据及输出路径；注释掉的参数为可选项，默认值通常无需填写。
# Replace model, data and output paths first. Commented options can normally be omitted.
# 参数教程 / Parameter guide: docs/training/parameters.md · docs/en/training/parameters.md

[model]
family = "z-image"
variant = "base"
weights = "/models/z-image.safetensors"
vae = "/models/vae.safetensors"
text_encoder = "/models/qwen3"

[dataset.groups.main]
kind = "restoration"
source = "/data/hq"
low_quality_source = "/data/lq"
cache_directory = "/data/cache-restoration-full"
batch_size = 1
repeats = 1
enable_bucket = true
bucket_no_upscale = false
caption_extension = ".txt"
# prompt = ""
horizontal_flip_probability = 0.5

[method]
kind = "restoration"

[losses]
lrr = 5.0
dv3d = 3.0
l1 = 0.5
gan = 0.5
histogram = 0.0

[method.restoration]
midtimestep = 244
dino_weights = "/models/dinov3-convnext.safetensors"

encoder_rank = 4
calibrate = false
histogram_bins = 32
# posterior = "sample"

[train]
parameter_mode = "full"
learning_rate = 0.000002

weight_decay = 0.01
max_grad_norm = 1.0
lr_schedule = "constant"
warmup_updates = 0
include_layers = []
exclude_layers = []

[execution]
precision = "fp32"
recompute = "block"

residency = "resident"
compile = false
# attention_activation_offload = false

[output]
directory = "runs/restoration-full"
name = "model"
save_precision = "fp32"
# tensorboard = "runs/tensorboard"
# max_resume_checkpoints = 1
# max_weight_checkpoints = 0
# checkpoint_storage = "frozen-reference"
# log_every_seconds = 60.0

[train.optimizer]
betas = [0.9, 0.999]
eps = 1e-08
backend = "auto"

[model.text.tokenizer]
offline = false
# source = "/models/tokenizer"
# revision = "commit-sha"

[runtime]
# cuda_allow_tf32 = false
# cudnn_enabled = true
# cudnn_benchmark = true
# cudnn_deterministic = false
