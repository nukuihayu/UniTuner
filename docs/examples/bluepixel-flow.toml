[model]
family = "bluepixel"
variant = "turbo"
weights = "models/BluePixel-Turbo/transformer"
vae = "models/BluePixel-Turbo/vae"
text_encoder = "models/BluePixel-Turbo/text_encoder"
assets = "models/BluePixel-Turbo"

[dataset.groups.main]
kind = "image"
source = "data/targets"
reference_sources = ["data/references"]
cache_directory = "cache/bluepixel-flow"
resolution = [1024, 1024]
batch_size = 1

[method]
kind = "flow-matching"

[train]
parameter_mode = "adapter"
learning_rate = 0.0001
max_updates = 1000

[train.adapter]
algorithm = "lora"
rank = 32
alpha = 32.0

[output]
directory = "runs/bluepixel-flow"
