# 用途 / Task: qwen-image-2-1 · train
# 命令 / Command: uv run unituner train docs/examples/qwen-image-2-1-restoration.toml --device cuda
# 先改模型、数据及输出路径；注释掉的参数为可选项，默认值通常无需填写。
# Replace model, data and output paths first. Commented options can normally be omitted.
# 参数教程 / Parameter guide: docs/training/parameters.md · docs/en/training/parameters.md

[model]
family = "qwen-image-2-1"
variant = "base"
weights = "artifacts/qwen-image-2-1.safetensors"
vae = "artifacts/qwen-image-2-1-vae.safetensors"
text_encoder = "artifacts/qwen3-vl"

[dataset.groups.main]
kind = "restoration"
source = "input/high"
low_quality_source = "input/low"
cache_directory = "cache/qwen21-restoration"
# [宽, 高] 像素；分桶开启时作为目标面积基准，实际尺寸随宽高比变化。
# [width, height] in pixels; with buckets enabled this sets target area, not one fixed crop size.
resolution = [512, 512]

batch_size = 1
repeats = 1
enable_bucket = true
bucket_no_upscale = false
caption_extension = ".txt"
# prompt = ""
horizontal_flip_probability = 0.5

[method]
kind = "restoration"

[method.restoration]
midtimestep = 244
encoder_rank = 4
posterior = "sample"
dino_weights = "artifacts/dinov3-convnext.safetensors"

calibrate = false
histogram_bins = 32

[losses]
lrr = 5.0
dv3d = 3.0
l1 = 0.5
gan = 0.5
histogram = 0.0

[train]
parameter_mode = "adapter"
weight_decay = 0.01
max_grad_norm = 1.0
lr_schedule = "constant"
warmup_updates = 0
include_layers = []
exclude_layers = []

[train.adapter]
algorithm = "lora"
rank = 32
alpha = 32.0

[execution]
precision = "fp32"
recompute = "block"

residency = "resident"
compile = false
# attention_activation_offload = false

[output]
directory = "runs/qwen21-restoration"
name = "model"

save_precision = "fp32"
# tensorboard = "runs/tensorboard"
# max_resume_checkpoints = 1
# max_weight_checkpoints = 0
# checkpoint_storage = "frozen-reference"
# log_every_seconds = 60.0

[preview]
every_updates = 50
num_images = 1

[train.optimizer]
betas = [0.9, 0.999]
eps = 1e-08
backend = "auto"

[model.text.tokenizer]
offline = false
# source = "/models/tokenizer"
# revision = "commit-sha"

[runtime]
# cuda_allow_tf32 = false
# cudnn_enabled = true
# cudnn_benchmark = true
# cudnn_deterministic = false
