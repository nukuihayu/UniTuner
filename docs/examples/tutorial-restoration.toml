# 用途 / Task: z-image · train
# 命令 / Command: uv run unituner train docs/examples/tutorial-restoration.toml --device cuda
# 先改模型、数据及输出路径；注释掉的参数为可选项，默认值通常无需填写。
# Replace model, data and output paths first. Commented options can normally be omitted.
# 参数教程 / Parameter guide: docs/training/parameters.md · docs/en/training/parameters.md

[model]
family = "z-image"
variant = "base"
weights = "models/z-image.safetensors"
vae = "models/z-image-vae.safetensors"
text_encoder = "models/qwen3"

[dataset.groups.main]
kind = "restoration"
source = "data/restoration/hq"
low_quality_source = "data/restoration/lq"
cache_directory = "cache/restoration"
# [宽, 高] 像素；分桶开启时作为目标面积基准，实际尺寸随宽高比变化。
# [width, height] in pixels; with buckets enabled this sets target area, not one fixed crop size.
resolution = [1024, 1024]
batch_size = 1

repeats = 1
enable_bucket = true
bucket_no_upscale = false
caption_extension = ".txt"
# prompt = ""
horizontal_flip_probability = 0.5

[train]
parameter_mode = "adapter"
learning_rate = 5e-5
weight_decay = 0.01
max_updates = 100
seed = 42

max_grad_norm = 1.0
lr_schedule = "constant"
warmup_updates = 0
include_layers = []
exclude_layers = []

[train.adapter]
algorithm = "lora"
rank = 32
alpha = 32.0

[method]
kind = "restoration"

[method.restoration]
calibrate = true
# 自动校准使用的配对数量；非默认值要求 calibrate=true。
# Number of pairs for automatic calibration; a nondefault value requires calibrate=true.
calibration_pairs = 32
encoder_rank = 4

histogram_bins = 32
# posterior = "sample"

[losses]
lrr = 5.0
l1 = 0.5
dv3d = 0.0
gan = 0.0
histogram = 0.0

[execution]
precision = "fp32"

residency = "resident"
recompute = "none"
compile = false
# attention_activation_offload = false

[output]
directory = "runs/restoration"
name = "restoration"
save_every_updates = 50

save_precision = "fp32"
# tensorboard = "runs/tensorboard"
# max_resume_checkpoints = 1
# max_weight_checkpoints = 0
# checkpoint_storage = "frozen-reference"
# log_every_seconds = 60.0

[preview]
every_updates = 50
at_start = true
num_images = 1

[train.optimizer]
betas = [0.9, 0.999]
eps = 1e-08
backend = "auto"

[model.text.tokenizer]
offline = false
# source = "/models/tokenizer"
# revision = "commit-sha"

[runtime]
# cuda_allow_tf32 = false
# cudnn_enabled = true
# cudnn_benchmark = true
# cudnn_deterministic = false
