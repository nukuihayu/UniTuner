# 用途 / Task: z-image · cache
# 命令 / Command: uv run unituner cache docs/examples/image-cache.toml --device cuda
# 先改模型、数据及输出路径；注释掉的参数为可选项，默认值通常无需填写。
# Replace model, data and output paths first. Commented options can normally be omitted.
# 参数教程 / Parameter guide: docs/training/parameters.md · docs/en/training/parameters.md

# unituner cache docs/examples/image-cache.toml --device cuda
# 随机种子；固定后便于比较配方，续训由状态文件恢复 RNG。
# Random seed for recipe comparisons; resume restores RNG from its state file.
seed = 42

[model]
family = "z-image"
variant = "base"
vae = "/models/z-image-vae.safetensors"
text_encoder = "/models/qwen3"

[dataset.defaults]
# [宽, 高] 像素；分桶开启时作为目标面积基准，实际尺寸随宽高比变化。
# [width, height] in pixels; with buckets enabled this sets target area, not one fixed crop size.
resolution = [1024, 1024]
# 覆盖该组全部 txt；留空字符串则使用空文本。
# Override all caption sidecars in this group; an empty string selects empty captions.
prompt = "a photo of sks person"

[dataset.groups.portraits]
source = "/data/portraits"
cache_directory = "/data/cache/portraits"
batch_size = 1
repeats = 1
enable_bucket = true
bucket_no_upscale = false
caption_extension = ".txt"

[model.text.tokenizer]
offline = false
# source = "/models/tokenizer"
# revision = "commit-sha"

[runtime]
# cuda_allow_tf32 = false
# cudnn_enabled = true
# cudnn_benchmark = true
# cudnn_deterministic = false
