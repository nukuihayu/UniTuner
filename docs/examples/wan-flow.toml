# 用途 / Task: wan · train
# 命令 / Command: uv run unituner train docs/examples/wan-flow.toml --device cuda
# 先改模型、数据及输出路径；注释掉的参数为可选项，默认值通常无需填写。
# Replace model, data and output paths first. Commented options can normally be omitted.
# 参数教程 / Parameter guide: docs/training/parameters.md · docs/en/training/parameters.md

# Train one native Wan expert from an existing verified mean cache.

[model]
family = "wan"
version = "2.2"
variant = "i2v"
weights = "artifacts/wan-2.2-i2v.safetensors"

[dataset.groups.main]
kind = "video"
source = "data/videos"
cache_directory = "cache/wan"
# [宽, 高] 像素；分桶开启时作为目标面积基准，实际尺寸随宽高比变化。
# [width, height] in pixels; with buckets enabled this sets target area, not one fixed crop size.
resolution = [512, 512]
batch_size = 1

repeats = 1
enable_bucket = true
bucket_no_upscale = false
caption_extension = ".txt"
# prompt = ""

[train]
parameter_mode = "adapter"
max_updates = 1000
accumulation_steps = 2
learning_rate = 0.0001
seed = 42

weight_decay = 0.01
max_grad_norm = 1.0
lr_schedule = "constant"
warmup_updates = 0
include_layers = []
exclude_layers = []

[train.adapter]
algorithm = "lora"
rank = 16
alpha = 16.0

[execution]
precision = "fp32"
residency = "resident"
recompute = "block"

compile = false
# attention_activation_offload = false

[output]
directory = "runs/wan"
name = "model"
save_precision = "bf16" # Published artifacts only; resume checkpoints retain training precision.
save_every_updates = 100

# tensorboard = "runs/tensorboard"
# max_resume_checkpoints = 1
# max_weight_checkpoints = 0
# checkpoint_storage = "frozen-reference"
# log_every_seconds = 60.0

[method]
kind = "flow-matching"

[train.optimizer]
betas = [0.9, 0.999]
eps = 1e-08
backend = "auto"

[runtime]
# cuda_allow_tf32 = false
# cudnn_enabled = true
# cudnn_benchmark = true
# cudnn_deterministic = false
