# 用途 / Task: flux3 · generate
# 命令 / Command: uv run unituner generate docs/examples/flux3-generate.toml --device cuda
# 先改模型、数据及输出路径；注释掉的参数为可选项，默认值通常无需填写。
# Replace model, data and output paths first. Commented options can normally be omitted.
# 参数教程 / Parameter guide: docs/training/parameters.md · docs/en/training/parameters.md

# 推理输出文件路径；图像通常为 PNG，视频按对应命令配置。
# Inference output file path; usually PNG for images, family-specific for video.
output = "output/flux3.png"

[model]
family = "flux3"
variant = "base"
weights = "weights/flux3-base.safetensors"
vae = "weights/flux3-vae.safetensors"
text_encoder = "weights/qwen3-vl-4b"

[sampling]
prompt = "A quiet mountain lake at sunrise"
width = 1024
height = 1024
seed = 42
steps = 50
guidance = 4.0
reference_images = []
attention_backend = "torch"
# shift = 1.0
# negative_prompt = ""

[runtime]
# cuda_allow_tf32 = false
# cudnn_enabled = true
# cudnn_benchmark = true
# cudnn_deterministic = false

[model.text.tokenizer]
# source = "/models/tokenizer"
# revision = "commit-sha"
offline = false
